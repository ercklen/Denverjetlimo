<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="#080808" rx="80"/>

  <!-- Car body - sleek sedan silhouette -->
  <path d="M72 308 L72 346 L440 346 L440 308 L400 308 L355 228 L290 208 L220 208 L170 228 L112 308 Z" fill="#ffffff"/>

  <!-- Cabin/roof - dark tinted -->
  <path d="M178 308 L215 238 L290 220 L340 220 L378 308 Z" fill="#0a0a0a" opacity="0.85"/>

  <!-- Windows -->
  <path d="M222 302 L232 248 L284 235 L284 302 Z" fill="#0a0a0a" opacity="0.9"/>
  <path d="M292 302 L292 235 L338 242 L362 302 Z" fill="#0a0a0a" opacity="0.9"/>

  <!-- Window divider -->
  <rect x="286" y="235" width="5" height="67" fill="#ffffff" opacity="0.6"/>

  <!-- Front wheel arch -->
  <circle cx="148" cy="346" r="44" fill="#0a0a0a"/>
  <circle cx="148" cy="346" r="44" fill="none" stroke="#ffffff" stroke-width="8"/>
  <circle cx="148" cy="346" r="16" fill="#ffffff" opacity="0.8"/>

  <!-- Rear wheel arch -->
  <circle cx="364" cy="346" r="44" fill="#0a0a0a"/>
  <circle cx="364" cy="346" r="44" fill="none" stroke="#ffffff" stroke-width="8"/>
  <circle cx="364" cy="346" r="16" fill="#ffffff" opacity="0.8"/>

  <!-- Headlight glow -->
  <ellipse cx="86" cy="312" rx="15" ry="8" fill="#ffffff" opacity="0.9"/>

  <!-- Taillight -->
  <ellipse cx="426" cy="312" rx="12" ry="6" fill="#ffffff" opacity="0.5"/>

  <!-- ✦ star mark top-right -->
  <text x="400" y="130" font-size="56" font-family="serif" fill="#ffffff" opacity="0.7" text-anchor="middle">✦</text>
</svg>